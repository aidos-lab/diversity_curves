[project]
name = "diversity_curves"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grakel>=0.1.10",
    "magnipy",
    "networkx>=3.4.2",
    "pygsp>=0.6.1",
    "torch-geometric>=2.7.0",
    "torch-cluster",
    "networkit>=11.2.1",
    "toper>=1.0.3",
    "gudhi>=3.11.0",
    "pyfqmr>=0.5.0",
    "pyvista>=0.47.1",
    "karateclub>=1.2.2",
    "giotto-tda>=0.6.0",
    "geosketch>=1.3",
    "scanpy>=1.9.8",
    "leidenalg>=0.12.0",
    "openpyxl>=3.1.5",
    "pandas>=1.3.5",
    "brec>=1.0.0",
]

[tool.uv.extra-build-dependencies]
grakel-dev = ["pip"]
torch-cluster = ["torch"]

[tool.uv.sources]
magnipy = { git = "https://github.com/aidos-lab/magnipy", rev = "magnitude_computations" }

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
]

[tool.setuptools]
packages = ["diversity_curves"]

